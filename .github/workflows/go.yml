name: Go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - run: go generate ./...
      - run: git diff --exit-code
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
